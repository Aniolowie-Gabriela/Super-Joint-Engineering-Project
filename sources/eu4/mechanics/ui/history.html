<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asystent EU4 — historia</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1f2328; --muted: #646b73; --line: #e2ddd3;
    --accent: #8a5a12; --user: #efe6d6; --agent: #ffffff; --ok: #2e7d4f; --warn: #b4501f;
    --chip: #f1ece2; --active: #efe6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1d2024; --ink: #e8e6e1; --muted: #9aa1a9; --line: #30343a;
      --accent: #d9a24a; --user: #2d2a24; --agent: #23272c; --ok: #5fc08a; --warn: #f08a5d;
      --chip: #262a2f; --active: #2d2a24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px;
          border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill[data-state="ready"] .dot { background: var(--ok); }
  .pill[data-state="listening"] .dot { background: var(--warn); animation: pulse 0.9s infinite; }
  .pill[data-state="speaking"] .dot { background: var(--accent); animation: pulse 0.9s infinite; }
  .pill[data-state="connecting"] .dot { background: var(--warn); }
  .pill[data-state="offline"] .dot { background: transparent; border: 1px solid var(--muted); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tools { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  input[type=search] { font: inherit; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line);
                       background: var(--bg); color: var(--ink); width: 100%; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 6px 12px; }
  .list { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
          border-radius: 0; padding: 10px 14px; background: transparent; }
  .item:hover { background: var(--chip); }
  .item[aria-current="true"] { background: var(--active); }
  .item .t { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .m { font-size: 12px; color: var(--muted); }
  .thread { overflow-y: auto; padding: 18px 22px; }
  .empty { color: var(--muted); font-size: 14px; }
  .day { color: var(--muted); font-size: 12px; text-align: center; margin: 4px 0 14px; }
  .msg { width: fit-content; max-width: 80%; padding: 9px 13px; border-radius: 12px; margin: 0 0 10px; white-space: pre-wrap; }
  .msg.user { margin-left: auto; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.agent { background: var(--agent); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .log { color: var(--warn); border: 1px dashed var(--warn); border-radius: 8px; padding: 6px 10px;
         margin: 0 0 10px; font-size: 13px; white-space: pre-wrap; }
  .log time { color: var(--muted); margin-right: 6px; }
  details.search { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; max-width: 80%;
                   background: var(--panel); }
  details.search > summary { cursor: pointer; padding: 7px 12px; font-size: 13px; color: var(--muted); }
  details.search > summary b { color: var(--ink); font-weight: 600; }
  .src { padding: 8px 12px; border-top: 1px solid var(--line); }
  .src .t { font-weight: 600; font-size: 14px; }
  .src .m { color: var(--muted); font-size: 12px; word-break: break-all; }
  .src a { color: var(--accent); }
  .src pre, .full pre { margin: 6px 0 0; font: 13px/1.45 inherit; white-space: pre-wrap; word-break: break-word; }
  .src .actions { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; }
  .src .actions button { padding: 2px 8px; font-size: 12px; }
  .full { border-top: 1px dashed var(--line); margin-top: 6px; }
  .read { font-size: 13px; color: var(--ok); margin: 0 0 10px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .msg, details.search { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Asystent EU4 — historia</h1>
  <div class="pill" id="pill" data-state="offline"><span class="dot"></span><span id="status">Łączę…</span></div>
</header>
<main>
  <aside>
    <div class="tools">
      <input type="search" id="q" placeholder="Szukaj w historii…" aria-label="Szukaj w historii">
      <button id="logs">Dziennik ostrzeżeń</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="thread" id="thread"><p class="empty">Wybierz rozmowę z listy.</p></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.hash.slice(1)).get("t") ?? "";
let current = null;       // numer otwartej rozmowy albo "logs"
let follow = true;        // otwarta jest najnowsza rozmowa: przechodź do kolejnych
let lastId = 0;
let newest = null;
let shown = new Set();    // zdarzenia już pokazane w wątku (odświeżanie i wczytywanie mogą się nałożyć)
let polling = false;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((child) => child !== null && child !== undefined));
  return node;
}

async function api(path) {
  const response = await fetch(path, { headers: { "X-Token": token } });
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}

const timeFmt = new Intl.DateTimeFormat("pl-PL", { hour: "2-digit", minute: "2-digit" });
const dayFmt = new Intl.DateTimeFormat("pl-PL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
function when(iso) {
  const date = new Date(iso);
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 864e5);
  const day = days === 0 ? "dziś" : days === 1 ? "wczoraj" : date.toLocaleDateString("pl-PL");
  return `${day} ${timeFmt.format(date)}`;
}

function safeUrl(url) {
  return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
}

// --- lista rozmów -----------------------------------------------------------------------
async function loadSessions() {
  const { sessions, last_id } = await api(`/api/sessions?q=${encodeURIComponent($("q").value)}`);
  if (!lastId) lastId = last_id;
  if (!$("q").value) newest = sessions[0]?.id ?? null;
  const list = $("list");
  list.replaceChildren();
  if (!sessions.length) list.append(el("p", { className: "empty", style: "padding: 12px 14px",
    textContent: $("q").value ? "Nic nie znaleziono." : "Jeszcze nie ma rozmów. Przytrzymaj skrót i zadaj pytanie." }));
  for (const s of sessions) {
    const meta = [when(s.started), `${s.questions} pyt.`, s.searches ? `${s.searches} wysz.` : null,
                  s.warnings ? `⚠ ${s.warnings}` : null].filter(Boolean).join(" · ");
    const button = el("button", { className: "item", onclick: () => openSession(s.id) },
      el("div", { className: "t", textContent: s.title || "(rozmowa bez pytania)" }),
      el("div", { className: "m", textContent: meta }));
    button.setAttribute("aria-current", String(s.id === current));
    button.dataset.id = s.id;
    list.append(button);
  }
  return sessions;
}

function markCurrent() {
  for (const item of $("list").querySelectorAll(".item"))
    item.setAttribute("aria-current", String(Number(item.dataset.id) === current));
}

// --- wątek rozmowy ----------------------------------------------------------------------
async function openSession(id) {
  current = id;
  follow = id === newest;
  markCurrent();
  const events = await api(`/api/session/${id}`);
  if (current !== id) return;  // w międzyczasie kliknięto inną rozmowę
  const thread = $("thread");
  thread.replaceChildren();
  shown = new Set(events.map((event) => event.id));
  if (events.length) thread.append(el("div", { className: "day", textContent: dayFmt.format(new Date(events[0].at)) }));
  for (const event of events) thread.append(render(event));
  thread.scrollTop = thread.scrollHeight;
}

function render(event) {
  if (event.kind === "user" || event.kind === "agent")
    return el("div", { className: `msg ${event.kind}` }, event.text, el("time", { textContent: timeFmt.format(new Date(event.at)) }));
  if (event.kind === "search") return renderSearch(event);
  if (event.kind === "record") {
    const record = event.data ?? {};
    const box = el("details", { className: "search" },
      el("summary", {}, "Agent przeczytał cały fragment: ", el("b", { textContent: record.title ?? event.text })));
    box.append(renderSource(record, true));
    return box;
  }
  return el("div", { className: "log" }, el("time", { textContent: when(event.at) }), event.text);
}

function renderSearch(event) {
  const results = Array.isArray(event.data) ? event.data : [];
  const box = el("details", { className: "search" },
    el("summary", {}, "Agent szukał: ", el("b", { textContent: event.text }), ` · ${results.length} źródeł`));
  if (!results.length) box.append(el("div", { className: "src m", textContent: "Brak wyników." }));
  for (const item of results) box.append(renderSource(item, false));
  return box;
}

function renderSource(item, full) {
  const location = [item.source_path, item.lines].filter(Boolean).join(":");
  const meta = [item.source_type, location, item.game_version, item.chunk_id].filter(Boolean).join(" · ");
  const src = el("div", { className: "src" },
    el("div", { className: "t", textContent: item.title ?? item.chunk_id }),
    el("div", { className: "m", textContent: meta }));
  const actions = el("div", { className: "actions" });
  const link = safeUrl(item.citation_url) ?? safeUrl(item.source_url);
  if (link) actions.append(el("a", { href: link, target: "_blank", rel: "noopener", textContent: "Otwórz źródło ↗" }));
  if (!full && item.chunk_id) {
    const more = el("button", { textContent: "Pełny fragment" });
    more.onclick = async () => {
      more.disabled = true;
      try {
        const record = await api(`/api/record?chunk_id=${encodeURIComponent(item.chunk_id)}`);
        src.append(el("div", { className: "full" }, el("pre", { textContent: record.text ?? "" })));
        more.remove();
      } catch (error) {
        more.textContent = `Błąd: ${error.message}`;
      }
    };
    actions.append(more);
  }
  if (actions.childNodes.length) src.append(actions);
  if (Array.isArray(item.game_refs) && item.game_refs.length)
    src.append(el("div", { className: "m", textContent: "Pliki gry: " + item.game_refs.map((ref) => [ref.path, ref.symbol].filter(Boolean).join(" → ")).join(", ") }));
  src.append(el("pre", { textContent: item.text ?? "" }));
  return src;
}

async function openLogs() {
  current = "logs";
  follow = false;
  markCurrent();
  const events = await api("/api/logs");
  const thread = $("thread");
  thread.replaceChildren(el("div", { className: "day", textContent: "Ostrzeżenia i błędy aplikacji (najnowsze na górze)" }));
  if (!events.length) thread.append(el("p", { className: "empty", textContent: "Brak ostrzeżeń." }));
  for (const event of events) thread.append(render(event));
  thread.scrollTop = 0;
}

// --- na żywo ----------------------------------------------------------------------------
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const { status, events } = await api(`/api/poll?after=${lastId}`);
    $("pill").dataset.state = status.state;
    $("status").textContent = `${status.label} · przytrzymaj ${status.hotkey}`;
    if (!events.length) return;
    lastId = events.at(-1).id;
    const thread = $("thread");
    const atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
    const known = new Set([...$("list").querySelectorAll(".item")].map((item) => Number(item.dataset.id)));
    const fresh = events.some((event) => event.session_id !== null && !known.has(event.session_id));
    for (const event of events) {
      if (event.session_id !== null && event.session_id === current && !shown.has(event.id)) {
        shown.add(event.id);
        thread.append(render(event));
      }
    }
    if (atBottom) thread.scrollTop = thread.scrollHeight;
    await loadSessions();
    if (fresh && follow && newest !== null && newest !== current) await openSession(newest);
  } catch {
    $("pill").dataset.state = "offline";
    $("status").textContent = "Asystent nie działa";
  } finally {
    polling = false;
  }
}

let typing;
$("q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(loadSessions, 250); });
$("logs").addEventListener("click", openLogs);

(async () => {
  try {
    const sessions = await loadSessions();
    if (sessions.length) await openSession(sessions[0].id);
  } catch (error) {
    $("thread").replaceChildren(el("p", { className: "empty", textContent: `Nie mogę wczytać historii: ${error.message}. Otwórz okno z ikony asystenta.` }));
  }
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
